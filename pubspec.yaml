name: th_system_settings
description: Reads three iOS system settings (Reduce Transparency, the notification permission, the app's notification settings page).
version: 0.1.0
homepage: https://github.com/niktravelhunter/th-system-settings
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ThSystemSettingsPlugin
